# Runtime environment of the mail-backend Cloud Run service. GitOps: the Deploy workflow applies this file on every
# deploy with `gcloud run deploy --env-vars-file`, which REPLACES all plain env vars (what is not listed here is removed).
# Secrets are NOT listed here: they come from Secret Manager (see BACKEND_SECRETS in .github/workflows/deploy.yml).
# Change a value = open a PR, merge, the workflow deploys it (a config-only change is a full deploy: migrate, no-traffic
# revision, smoke test, traffic shift). Values must be strings, so quote numbers and booleans.
NODE_ENV: "production"
WORKER_MODE: "scheduled"
SEND_WINDOW_ENFORCED: "true"
MIGRATE_ON_START: "false" # the mail-migrate job runs before every rollout

# Real sends. true records sends without contacting Gmail (the emergency lever is pausing the scheduler jobs, docs/deploy.md).
DRY_RUN: "false"
DAILY_SEND_CAP: "100"
MAX_PER_TICK: "5"
SWEEP_MAX_AGE_MINUTES: "90"
# Must stay below the 900s Cloud Run timeout and well below the 600s scheduler attempt deadline: after the deadline one more
# send can still finish (up to 90s), so 480 + 90 stays under 600.
INTERNAL_TICK_DEADLINE_SECONDS: "480"
# FROM_NAME: "Your Name"

# Proxy hops that append to X-Forwarded-For in front of Express. 1 on purpose: the backend is publicly reachable, so with 2 a
# direct caller could forge X-Forwarded-For and pick its own limiter bucket. See docs/deploy.md "TRUST_PROXY".
TRUST_PROXY: "1"

RESUME_STORAGE: "gcs"
RESUME_BUCKET: "mail-autosender-resumes-codecell"

# Hardcoded on purpose (they used to be computed by Terraform). The URL is Cloud Run's deterministic
# https://<service>-<project number>.<region>.run.app; the audience must equal it exactly. The invoker is the
# Terraform-managed scheduler service account (infra/iam.tf).
INTERNAL_AUDIENCE: "https://mail-backend-177290233934.asia-south1.run.app"
INTERNAL_INVOKER_SA: "scheduler-invoker@codecell-vesit.iam.gserviceaccount.com"
